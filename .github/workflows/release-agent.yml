name: Package Windows agent release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean agent ZIP
        shell: pwsh
        run: ./agent/package_agent.ps1 -OutputPath "$env:RUNNER_TEMP/ThreatTronAgent.zip"

      - name: Attach agent ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" "$env:RUNNER_TEMP/ThreatTronAgent.zip" --clobber
